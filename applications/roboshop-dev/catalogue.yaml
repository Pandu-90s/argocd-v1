apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalogue
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: 'https://github.com/Pandu-90s/catalogue-config.git'
    targetRevision: main
    path: .
    helm:
      valueFiles:
        - values-dev.yaml
        - values.yaml

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: roboshop-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
